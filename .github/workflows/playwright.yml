name: Playwright E2E (full stack)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: UI e2e (NestJS + Vite + SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      # ---- Backend ----
      - name: Install backend deps
        working-directory: server
        run: npm ci

      - name: Generate Prisma client + migrate test DB
        working-directory: server
        env:
          DATABASE_URL: file:./e2e.db
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma db push --schema=prisma/schema.prisma
          npx ts-node -T prisma/seed-e2e.ts

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Start NestJS backend
        working-directory: server
        env:
          DATABASE_URL: file:./e2e.db
          PORT: 3000
          SITE_URL: http://localhost:5173
          RESEND_API_KEY: re_dummy_ci 
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
        run: npm run start:prod &

      # ---- Frontend ----
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Start Vite dev server (proxies /api to :3000)
        working-directory: frontend
        run: npm run dev &

      # ---- Playwright ----
      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for backend + frontend
        working-directory: e2e
        run: npx wait-on tcp:3000 tcp:5173 --timeout 120000

      - name: Run Playwright tests
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
